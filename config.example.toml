version = 1
default_workspace = "main"

[telegram]
# 可在 Setup 中独立停用并保留凭据；未设置 enabled 时按非空 Token 判断启用。
enabled = true
bot_token = "你的_Bot_Token"
allowed_user_ids = [123456789]
message_format = "html"

[feishu]
# 飞书可通过 codexc setup 配置；手工填写时改为 true。
enabled = false
# app_id = "cli_0123456789abcdef"
# app_secret = "你的_飞书_App_Secret"
# allowed_open_ids = ["ou_xxx"]

# 微信通过 codexc setup 扫码，最终确认保存后自动设为 true。
# [weixin]
# enabled = false
# account_id = "不透明账号@im.bot"
# allowed_user_ids = ["不透明用户@im.wechat"]

[qq]
# QQ 可通过 codexc setup 扫码或手工配置；群授权可配对识别身份或手工填写。
# 空单聊允许名单不会授权单聊用户；用户 OpenID 必须来自同一 QQ 应用。
enabled = false
# app_id = "1234567890"
# app_secret = "你的_QQ_AppSecret"
# allowed_user_openids = ["当前应用下的用户_OpenID"]
# 群默认关闭。仅接收明确配置群内允许成员的 @机器人消息；单聊名单不授予群权限。
# 每位允许成员拥有独立会话，只能控制自己的会话；任务、审批与结果向全群公开。
# 必须显式同意公开输出；群或成员名单变化要求重启 Gateway。OpenID 不能用 QQ 号码替代。
# [[qq.groups]]
# group_openid = "当前应用下的群_OpenID"
# allowed_member_openids = ["当前群内成员_OpenID"]
# allow_public_output = true

# 共享网络代理通过 codexc config 写入 ~/.codex/.env，不在 Gateway TOML 中保存。

[codex]
binary = "codex"
socket_path = "runtime/codex-app-server.sock"
# 仅覆盖当前主 Provider；模型必须存在于该 Provider 的目录中。
default_model = ""
# 默认以官方 codex-tui 身份连接 App Server，模型上游 User-Agent 由 App Server 按当前锁定
# Codex CLI 版本生成，升级后自动跟随；下面两个字段缺省即使用默认值，仅在需要覆盖时填写，
# 已填写的值默认固定；一键设置会写入 follow_cli_version = true，后续只更新 Codex 版本。
# 可用 codexc config → 身份与时区 → 一键设为官方 TUI 身份 生成并启用跟随：
# follow_cli_version = false
# upstream_user_agent = "Mozilla/5.0 MyClient/1.0"
# [codex.client_identity]
# name = "my_client"
# title = "My Codex Client"
# version = "1.0.0"
# App Server 由服务进程启动、自身没有终端，模型上游 UA 的终端标识缺省为 unknown；
# 取值由运行 `codexc config`、安装或更新服务的命令按其终端自动探测后写入，
# 也可以直接填写「终端名」或「终端名/版本」；重启服务后生效：
# terminal_identity = "iTerm.app/3.5.14"
# 模型可见时区：App Server 请求里的 environment context 时区与当前日期，WebUI 页面时间同步跟随；
# 缺省沿用系统时区，网关默认也跟随此配置，不修改系统。用 codexc timezone 设置，重启后生效：
# timezone = "America/Los_Angeles"

[gateway]
# 不设置 timezone 时跟随 codex.timezone；App Server 未配置时沿用系统时区。
# 用 codexc timezone --gateway 选择；重启网关后生效。
# timezone = "system"        # 独立使用系统时区
# timezone = "Asia/Shanghai" # 自定义 IANA 时区

[approval]
timeout_seconds = 900

[conversation]
# 渠道会话在连续无用户输入和会话输出时自动解除 Thread 绑定的分钟数；
# 0 表示关闭渠道会话自动解除。无任何绑定时，Gateway 仍会执行全局空闲释放，
# 停止未被租约占用的 App Server。所有渠道统一使用该值。
idle_release_minutes = 15

[display]
# 可通过 codexc config → Gateway 显示设置 → 模型统计分组维护；仅合并控制台按模型统计。
# 模型选择和明细保留原模型；重新读取即生效，无需重启服务。
# model_aliases = { "cline-pass/deepseek-v4.1-flash" = "deepseek-flash", "deepseek-v4.1-flash" = "deepseek-flash" }
# full：完整详情；compact：单行摘要；failures：仅 failed/declined；hidden：隐藏操作过程。
operation_updates = "compact"
# 可选子代理显示，缺省 true，不自动写入；关闭同时隐藏生命周期和子代理工具操作。
# 其他工具仍按 operation_updates；正文、图片、审批与父轮完成或失败保留。
# subagents = true
# 可选流式显示，缺省 true，不自动写入；仅控制 Telegram、飞书与 QQ 单聊的正文增量预览。
# 不改变上游模型流式、思考状态、完整正文、附件、授权或原窗口和交付义务。
# 微信和 QQ 群覆盖严格拒绝 streaming（true/false）；QQ 渠道、账号层只作用其单聊。
# streaming = true
# 是否在渠道显示 App Server 的自动任务计划更新。
plan_updates = true
# 是否在渠道显示“思考中”状态卡；默认 false，不显示。
reasoning = false
# 可选完成通知：off 仅隐藏新成功通知；brief 精简；detailed 详细（缺省，不自动写入）。
# 失败、停止、缺少最终回答和已有 pending 保留；精简不代表正文已送达。
# completion = "detailed"
# 可选消息详情：basic 基础（缺省，不自动写入）；detailed 展开启动运行环境及完成/子代理统计子项。
# 独立于日志等级和调用采集，不改变任务、审批或完成通知开关。
# presentation_detail = "basic"
# 可选范围覆盖，普通读取不会生成。通过 codexc config 的“范围显示覆盖”或 WebUI 管理。
# 全局 → 渠道 → 账号 → 账号聊天类型 → 指定聊天，字段缺失继承，false/hidden 保留。
# surface 支持 telegram、feishu、qq、weixin；微信允许 completion/presentation_detail，chat_kind=group 仅 QQ。
# account_id 使用 Gateway 账号标识：Telegram 为 default，飞书/QQ 为 AppID，微信为配置的 account_id。
# [[display.overrides]]
# surface = "qq"
# account_id = "123456"
# chat_kind = "group"
# chat_id = "物理群OpenID"
# operation_updates = "hidden"
# subagents = false
# plan_updates = false

[debug]
# Codex 与 Relay 共用的调用详情开关，写入 Gateway 数据目录下的 traffic，默认关闭；
# Codex 重启 App Server 后生效；Relay 配置刷新后用于新请求。
# 调用记录预设：仅 0/0 显示调试，3/65536 显示生产，其他合法组合显示自定义及实际值；
# 不改变日志等级或开发运行方式。裁剪值用于 Codex；Relay 仅在 0/0 时增加入站与交付采集阶段。
# V2 转储按逻辑模型调用保存一条请求和一个终态响应，完整 SSE/WS 传输轨迹另存为 trace；
# 包含 prompt、工具输出和代码，但不包含 Authorization、Cookie 等凭据。写入失败不影响模型请求。
model_traffic_dump = false
# 转储体积控制：每次请求都会重发完整会话历史，按原样落盘会让单个请求就有几 MB。默认只保留请求
# input 的末尾 3 条完整条目（更早的折叠为条数与字节数摘要）、丢弃逐条流式 .delta 事件（完整文本
# 仍由 *.done 事件承载），并把响应里重复回显的 instructions 与 tools 折叠为长度占位；
# 需要按原样转储完整报文时改为 0。
model_traffic_input_items = 3
# 单条正文上限：请求 input 条目、响应 output 条目等单个数组条目超过该字节数时只保留头尾，并写入
# {"type":"truncated","bytes":…,"head":…,"tail":…} 标记；0 表示不限制。
model_traffic_item_max_bytes = 65536
# 历史转储保留天数；App Server 启动及新记录批次建立时按最后活动时间清理，0 表示关闭按时间清理。
model_traffic_retention_days = 30

[scheduled_tasks]
# Gateway 计划任务默认关闭；启用后使用独立私有数据库并由 App Server 执行 Turn。
enabled = false

[storage]
database_path = "data/gateway.sqlite3"

[logging]
level = "info"

[webui]
# WebUI 后台服务开关：false 后 codexc start all 跳过它、codexc restart all 停止它且不再启动，
# codexc update 也不恢复它（未设置时沿用已安装状态）；设置本身不停止正在运行的实例，
# 也不删除已生成的服务定义。
# enabled = false
# codexc webui 的监听地址与访问令牌；不配置时默认 127.0.0.1:8787。
# host 只允许 127.0.0.1、::1（仅本机）或 0.0.0.0（所有网卡）；
# 绑定 0.0.0.0 时 token 必填，CLI 参数（--host/--port/--token）优先于本段。
# host = "127.0.0.1"
# port = 8787
# token = "你的_WebUI_访问令牌"

[metrics.storage]
# 本地指标自动保留策略；达到任一上限时删除最旧记录。
retention_days = 365
max_rows = 1000000

[[workspaces]]
id = "main"
name = "Main Project"
cwd = "/absolute/path/to/project"
