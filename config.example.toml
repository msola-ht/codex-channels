version = 1
default_workspace = "main"

[telegram]
# 不使用 Telegram 时可删除本表，或将 bot_token 留空并把 allowed_user_ids 设为空数组。
bot_token = "你的_Bot_Token"
allowed_user_ids = [123456789]
message_format = "html"

[feishu]
# 飞书可通过 codexc setup 配置；手工填写时改为 true。
enabled = false
# app_id = "cli_0123456789abcdef"
# app_secret = "你的_飞书_App_Secret"
# allowed_open_ids = ["ou_xxx"]

# 微信只能通过 codexc setup 扫码保存凭据；确认账号后可改为 true。
# [weixin]
# enabled = false
# account_id = "不透明账号@im.bot"
# allowed_user_ids = ["不透明用户@im.wechat"]

[network]
# Telegram、飞书和微信共用；留空时依次使用标准代理环境变量和当前系统代理。
# 填写的字段优先，no_proxy 按每个请求的目标域名决定直连。
http_proxy = ""
https_proxy = ""
all_proxy = ""
no_proxy = "localhost,127.0.0.1"

[codex]
binary = "codex"
socket_path = "runtime/codex-app-server.sock"
# 仅覆盖当前主 Provider；模型必须存在于该 Provider 的目录中。
default_model = ""
sandbox = "workspace-write"
# 默认以官方 codex-tui 身份连接 App Server，模型上游 User-Agent 由 App Server 按当前锁定
# Codex CLI 版本生成，升级后自动跟随；下面两个字段缺省即使用默认值，仅在需要覆盖时填写，
# 覆盖后不再跟随升级，可用 codexc config → 系统设置 → 一键设为官方 TUI 身份 重新生成：
# upstream_user_agent = "Mozilla/5.0 MyClient/1.0"
# [codex.client_identity]
# name = "my_client"
# title = "My Codex Client"
# version = "1.0.0"
# App Server 由服务进程启动、自身没有终端，模型上游 UA 的终端标识缺省为 unknown；
# 取值由运行 `codexc config`、安装或更新服务的命令按其终端自动探测后写入，
# 也可以直接填写「终端名」或「终端名/版本」；重启服务后生效：
# terminal_identity = "iTerm.app/3.5.14"

[approval]
timeout_seconds = 900

[conversation]
# 渠道会话在连续无用户输入和会话输出时自动解除 Thread 绑定的分钟数；
# 0 表示关闭渠道会话自动解除。无任何绑定时，Gateway 仍会执行全局空闲释放，
# 停止未被租约占用的 App Server。所有渠道统一使用该值。
idle_release_minutes = 15

[display]
# full：完整详情；compact：单行摘要；hidden：隐藏操作过程。
operation_updates = "compact"
# 是否在渠道显示 App Server 的自动任务计划更新。
plan_updates = true
# 是否在渠道显示“思考中”状态卡；false 时不显示。
reasoning = true

[experimental]
# Codex 0.148.0 Plugin API 仍在开发中，默认关闭；仅在需要调试时显式开启。
plugin_api = false

[debug]
# 把模型请求和响应的完整报文写入 Gateway 数据目录下的 traffic 转储文件，默认关闭；
# 仅在排查模型请求字段时临时开启，重启服务后生效。
# 转储包含完整 prompt、工具输出、代码和 SSE 事件，但不包含 Authorization、Cookie 等凭据；
# 单文件达到上限后轮转，目录只保留最近的转储文件；写入失败只停止转储，不影响模型请求。
model_traffic_dump = false
# 转储体积控制：大于 0 时只保留请求 input 的末尾若干条完整条目（更早的折叠为条数与字节数
# 摘要），丢弃逐条流式 .delta 事件（完整文本仍由 *.done 事件承载），并把响应里重复回显的
# instructions 与 tools 折叠为长度占位；请求头、请求体其它字段和保留的响应事件保持完整。
# 0 表示按原样转储完整报文，默认关闭精简。
model_traffic_input_items = 0

[scheduled_tasks]
# Gateway 计划任务默认关闭；启用后使用独立私有数据库并由 App Server 执行 Turn。
enabled = false

[storage]
database_path = "data/gateway.sqlite3"

[logging]
level = "info"

[webui]
# codexc webui 的监听地址与访问令牌；不配置时默认 127.0.0.1:8787。
# host 只允许 127.0.0.1、::1（仅本机）或 0.0.0.0（所有网卡）；
# 绑定 0.0.0.0 时 token 必填，CLI 参数（--host/--port/--token）优先于本段。
# host = "127.0.0.1"
# port = 8787
# token = "你的_WebUI_访问令牌"

[metrics.storage]
# 本地指标自动保留策略；达到任一上限时删除最旧记录。
retention_days = 365
max_rows = 1000000

[[workspaces]]
id = "main"
name = "Main Project"
cwd = "/absolute/path/to/project"
# 工作区权限（可选，不配置时使用全局默认）：
# 沙箱：read-only / workspace-write / danger-full-access
sandbox = "workspace-write"
# 审批：untrusted / on-request / never
approval_policy = "on-request"
# 权限 Profile（App Server 命名 profile，例如 :read-only、:workspace、:danger-full-access 或项目自定义）。
# 设置了 permissions 后不能再设置 sandbox。
# permissions = ":workspace"
