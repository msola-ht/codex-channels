version = 1
default_workspace = "main"

[telegram]
# 不使用 Telegram 时可删除本表，或将 bot_token 留空并把 allowed_user_ids 设为空数组。
bot_token = "你的_Bot_Token"
allowed_user_ids = [123456789]
message_format = "html"

[feishu]
# 飞书可通过 codexc setup 配置；手工填写时改为 true。
enabled = false
# app_id = "cli_0123456789abcdef"
# app_secret = "你的_飞书_App_Secret"
# allowed_open_ids = ["ou_xxx"]

# 微信只能通过 codexc setup 扫码保存凭据；确认账号后可改为 true。
# [weixin]
# enabled = false
# account_id = "不透明账号@im.bot"
# allowed_user_ids = ["不透明用户@im.wechat"]

[network]
# Telegram、飞书和微信共用；留空时依次使用标准代理环境变量和当前系统代理。
# 填写的字段优先，no_proxy 按每个请求的目标域名决定直连。
http_proxy = ""
https_proxy = ""
all_proxy = ""
no_proxy = "localhost,127.0.0.1"

[codex]
binary = "codex"
socket_path = "runtime/codex-app-server.sock"
# 仅覆盖当前主 Provider；模型必须存在于该 Provider 的目录中。
default_model = ""
sandbox = "workspace-write"

[approval]
timeout_seconds = 300

[display]
# full：完整详情；compact：单行摘要；hidden：隐藏操作过程。
operation_updates = "compact"
# 是否在渠道显示 App Server 的自动任务计划更新。
plan_updates = true
# 模型价格显示币种：全局统一为 cny（人民币）或 usd（美元）；
# 选择 cny 时 Gateway 会刷新并持久化汇率，拉取失败时继续使用最后一次缓存。
price_currency = "cny"

[experimental]
# Codex 0.147.0 Plugin API 仍在开发中，默认关闭；仅在需要调试时显式开启。
plugin_api = false

[thread_sections]
# 自定义 Thread 分区是 App Server 全局状态；只有这里列出的 Actor 可以修改。
# 格式：telegram:<用户 ID>、feishu:<open_id>、weixin:<用户 ID>。
administrators = []

# 直接 API 提供商（图片识别等第三方 Responses 中转）：
# [[api_providers]]
# id = "vision-relay"
# name = "视觉中转"
# protocol = "responses"
# endpoint = "https://example.com/v1/responses"

[vision]
# disabled：不代理识图；responses_api：当前模型不支持图片时调用外部视觉接口。
mode = "disabled"
# provider = "vision-relay"   # 必须引用上方 api_providers 的 id
# model = "视觉模型"
# timeout_seconds = 120  # 视觉请求超时，范围 30–600 秒，默认 120 秒
# API Key 通过 codexc setup 保存到独立私有凭据文件，不写入本配置。

[storage]
database_path = "data/gateway.sqlite3"

[logging]
level = "info"

[webui]
# codexc webui 的监听地址与访问令牌；不配置时默认 127.0.0.1:8787。
# host 只允许 127.0.0.1、::1（仅本机）或 0.0.0.0（所有网卡）；
# 绑定 0.0.0.0 时 token 必填，CLI 参数（--host/--port/--token）优先于本段。
# host = "127.0.0.1"
# port = 8787
# token = "你的_WebUI_访问令牌"

[metrics.storage]
# 本地指标自动保留策略；达到任一上限时删除最旧记录。
retention_days = 365
max_rows = 1000000

[metrics.sync]
# 多设备指标汇总：启用后本机把脱敏用量/费用增量上报到中心端点。
# 启用时必须配置 endpoint 和 device_token；endpoint 使用 HTTPS，
# 或指向回环/私网地址的 HTTP（公网地址必须 HTTPS）。
# enabled = false
# endpoint = "https://中心服务器/api/ingest"
# device_token = "设备上报令牌"
# device_id = "本设备标识（留空则首次启动自动生成）"
# batch_size = 200
# interval_seconds = 60

[metrics.center]
# 中心接收服务（只在汇总的 VPS 上启用）：接收设备上报并写入中心 SQLite。
# 绑定非回环地址（0.0.0.0）时必须设置两类不同令牌。
# enabled = false
# host = "127.0.0.1"
# port = 8790
# token = "中心只读查看令牌"
# device_token = "设备上报令牌（必须与 token 不同）"
# database_path = "data/central-metrics.sqlite3"

[metrics.view]
# WebUI 控制台的设备范围：本机不运行中心服务时，也用它连接中心查看全部设备累计。
# 启用时必须配置 endpoint 和 token；endpoint 使用 HTTPS，或指向回环/私网地址的 HTTP。
# enabled = false
# endpoint = "http://127.0.0.1:8790"
# token = "中心只读查看令牌"

[[workspaces]]
id = "main"
name = "Main Project"
cwd = "/absolute/path/to/project"
# 工作区权限（可选，不配置时使用全局默认）：
# 沙箱：read-only / workspace-write / danger-full-access
sandbox = "workspace-write"
# 审批：untrusted / on-request / never
approval_policy = "on-request"
# 权限 Profile（App Server 命名 profile，例如 :read-only、:workspace、:danger-full-access 或项目自定义）。
# 设置了 permissions 后不能再设置 sandbox。
# permissions = ":workspace"
