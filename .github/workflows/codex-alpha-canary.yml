name: Codex alpha canary

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-alpha-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Test latest official Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve latest official Alpha
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-alpha-canary
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          node scripts/resolve-codex-alpha.mjs 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/resolve.log"

      - name: Install Alpha Codex CLI
        id: install
        if: steps.release.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-alpha-canary
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          npm install --global "@openai/codex@$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/install.log"

      - name: Generate Alpha protocol
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_BINARY: codex
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-alpha-canary
        run: |
          set -o pipefail
          npm run protocol:generate 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/generation.log"

      - name: Run Alpha compatibility checks
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_BINARY: codex
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-alpha-canary
        run: |
          npm run codex:upgrade:validate -- "$REPORT_DIRECTORY"

      - name: Write Alpha report
        if: always()
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version || 'unresolved' }}
          CANARY_RESULT: ${{ steps.release.outcome == 'success' && steps.install.outcome == 'success' && steps.generate.outcome == 'success' && steps.validate.outcome == 'success' && 'success' || 'failure' }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-alpha-canary
          RESOLUTION_OUTCOME: ${{ steps.release.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          node scripts/write-upgrade-report.mjs \
            "$CODEX_VERSION" "$REPORT_DIRECTORY" alpha "$CANARY_RESULT"

      - name: Upload Alpha report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-alpha-${{ steps.release.outputs.version || format('unresolved-{0}', github.run_id) }}
          path: ${{ runner.temp }}/codex-alpha-canary/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when Alpha compatibility checks failed
        if: >-
          always() &&
          (
            steps.release.outcome != 'success' ||
            steps.install.outcome != 'success' ||
            steps.generate.outcome != 'success' ||
            steps.validate.outcome != 'success'
          )
        run: exit 1
