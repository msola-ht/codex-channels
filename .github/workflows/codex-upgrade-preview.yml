name: Codex upgrade preview

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 正式发行版本；留空使用 openai/codex 最新正式 Release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-upgrade-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Generate released CLI diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve official stable release
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.version }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          node scripts/resolve-codex-release.mjs "$TARGET_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/resolve.log"

      - name: Install released Codex CLI
        id: install
        if: >-
          steps.release.outcome == 'success' &&
          steps.release.outputs.upgrade_available == 'true'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          npm install --global "@openai/codex@$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/install.log"

      - name: Generate upgrade preview
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          set -o pipefail
          npm run codex:upgrade -- "$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/generation.log"

      - name: Run released CLI compatibility checks
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_BINARY: codex
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: npm run codex:upgrade:validate -- "$REPORT_DIRECTORY"

      - name: Write diff report
        if: >-
          always() &&
          (
            steps.release.outcome == 'failure' ||
            steps.release.outputs.upgrade_available == 'true'
          )
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version || 'unresolved' }}
          PREVIEW_RESULT: ${{ steps.release.outcome == 'success' && steps.install.outcome == 'success' && steps.generate.outcome == 'success' && steps.validate.outcome == 'success' && 'success' || 'failure' }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
          RESOLUTION_OUTCOME: ${{ steps.release.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          node scripts/write-upgrade-report.mjs \
            "$CODEX_VERSION" "$REPORT_DIRECTORY" stable "$PREVIEW_RESULT"

      - name: Upload diff files
        if: >-
          always() &&
          (
            steps.release.outcome == 'failure' ||
            steps.release.outputs.upgrade_available == 'true'
          )
        uses: actions/upload-artifact@v7
        with:
          name: codex-upgrade-${{ steps.release.outputs.version || format('unresolved-{0}', github.run_id) }}
          path: ${{ runner.temp }}/codex-upgrade-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when preview generation or validation failed
        if: >-
          always() &&
          (
            steps.release.outcome != 'success' ||
            (
              steps.release.outputs.upgrade_available == 'true' &&
              (
                steps.install.outcome != 'success' ||
                steps.generate.outcome != 'success' ||
                steps.validate.outcome != 'success'
              )
            )
          )
        run: exit 1
