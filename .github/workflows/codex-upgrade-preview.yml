name: Codex upgrade proposal

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 正式发行版本；留空使用 openai/codex 最新正式 Release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-upgrade-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Generate released CLI diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upgrade_available: ${{ steps.release.outputs.upgrade_available }}
      version: ${{ steps.release.outputs.version }}
      release_url: ${{ steps.release.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve official stable release
        id: release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.version }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          node scripts/resolve-codex-release.mjs "$TARGET_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/resolve.log"

      - name: Install released Codex CLI
        id: install
        if: >-
          steps.release.outcome == 'success' &&
          steps.release.outputs.upgrade_available == 'true'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY/logs"
          set -o pipefail
          npm install --global "@openai/codex@$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/install.log"

      - name: Generate upgrade preview
        id: generate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          set -o pipefail
          npm run codex:upgrade -- "$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/logs/generation.log"

      - name: Run released CLI compatibility checks
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          CODEX_BINARY: codex
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: npm run codex:upgrade:validate -- "$REPORT_DIRECTORY"

      - name: Write diff report
        if: >-
          always() &&
          (
            steps.release.outcome == 'failure' ||
            steps.release.outputs.upgrade_available == 'true'
          )
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version || 'unresolved' }}
          PREVIEW_RESULT: ${{ steps.release.outcome == 'success' && steps.install.outcome == 'success' && steps.generate.outcome == 'success' && steps.validate.outcome == 'success' && 'success' || 'failure' }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
          RESOLUTION_OUTCOME: ${{ steps.release.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          node scripts/write-upgrade-report.mjs \
            "$CODEX_VERSION" "$REPORT_DIRECTORY" stable "$PREVIEW_RESULT"

      - name: Upload diff files
        if: >-
          always() &&
          (
            steps.release.outcome == 'failure' ||
            steps.release.outputs.upgrade_available == 'true'
          )
        uses: actions/upload-artifact@v7
        with:
          name: codex-upgrade-${{ steps.release.outputs.version || format('unresolved-{0}', github.run_id) }}
          path: ${{ runner.temp }}/codex-upgrade-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when preview generation or validation failed
        if: >-
          always() &&
          (
            steps.release.outcome != 'success' ||
            (
              steps.release.outputs.upgrade_available == 'true' &&
              (
                steps.install.outcome != 'success' ||
                steps.generate.outcome != 'success' ||
                steps.validate.outcome != 'success'
              )
            )
          )
        run: exit 1

  propose:
    name: Create draft upgrade pull request
    needs: preview
    if: >-
      needs.preview.result == 'success' &&
      needs.preview.outputs.upgrade_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find existing draft proposal
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: 升级 Codex CLI 至 ${{ needs.preview.outputs.version }}
        run: |
          existing_url="$(
            gh pr list \
              --state open \
              --search "$PR_TITLE in:title" \
              --json url \
              --jq '.[0].url // ""'
          )"
          echo "url=$existing_url" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_url" ]]; then
            echo "已存在升级提案：$existing_url"
          fi

      - name: Download validated upgrade patch
        if: steps.existing.outputs.url == ''
        uses: actions/download-artifact@v8
        with:
          name: codex-upgrade-${{ needs.preview.outputs.version }}
          path: ${{ runner.temp }}/codex-upgrade-report

      - name: Apply validated upgrade patch
        if: steps.existing.outputs.url == ''
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-report
        run: |
          git apply --check "$REPORT_DIRECTORY/upgrade.patch"
          git apply "$REPORT_DIRECTORY/upgrade.patch"

      - name: Commit and push proposal branch
        if: steps.existing.outputs.url == ''
        env:
          BRANCH_NAME: automation/codex-upgrade-${{ needs.preview.outputs.version }}-${{ github.run_id }}
          CODEX_VERSION: ${{ needs.preview.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add --all
          git commit -m "准备升级 Codex CLI 至 $CODEX_VERSION"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create draft pull request
        if: steps.existing.outputs.url == ''
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: automation/codex-upgrade-${{ needs.preview.outputs.version }}-${{ github.run_id }}
          CODEX_VERSION: ${{ needs.preview.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          PR_BODY: |
            这是由 Codex 正式版升级工作流生成的 Draft PR。

            自动阶段已经完成协议生成、类型检查、Lint、全量测试、真实 App Server 合同、构建和打包验证。完整 Patch、协议影响、结构化结果与逐阶段日志保存在本次运行的 Artifact 中。

            官方发布说明：${{ needs.preview.outputs.release_url }}

            ## 对本项目的收益

            待 Codex 对照当前 Gateway 架构、支持矩阵和实际使用路径填写；不要照抄上游功能清单。

            ## 本次采用

            待 Codex 逐项写明必须适配或决定接入的变化、项目入口及采用理由。

            ## 本次不采用

            待 Codex 逐项写明仅存在于生成类型或上游产品、但本项目不导出或不接入的变化及理由。

            ## 风险与验证

            待 Codex 写明安全边界、兼容风险、定向测试、真实合同和完整门禁结果。

            合并前仍需由 Codex：

            - 先从上述官方发布说明筛选 CLI/TUI、App Server 协议和内部修复对本项目的影响；
            - 对照固定版本官方源码和测试审查协议语义；
            - 修复业务枚举、通知、Server Request 与安全边界适配；
            - 把上述四个占位章节替换为本项目的实际收益与取舍结论；
            - 更新 `docs/index.md`、README、CI 锁定版本及相关测试；
            - 运行 `npm run verify:commit` 并审查最终差异。

            占位内容未替换时，升级 PR 描述门禁会阻止 Ready PR 通过。本工作流不会自动转为 Ready、合并、发布或部署。

            升级运行：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh pr create
          --draft
          --base "$BASE_BRANCH"
          --head "$BRANCH_NAME"
          --title "升级 Codex CLI 至 $CODEX_VERSION"
          --body "$PR_BODY"
