name: Codex upgrade preview

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 正式发行版本；留空使用 openai/codex 最新正式 Release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-upgrade-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Generate released CLI diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Resolve official stable release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_VERSION: ${{ inputs.version }}
        run: node scripts/resolve-codex-release.mjs "$TARGET_VERSION"

      - name: Install dependencies
        if: steps.release.outputs.upgrade_available == 'true'
        run: npm ci --ignore-scripts

      - name: Install released Codex CLI
        if: steps.release.outputs.upgrade_available == 'true'
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"

      - name: Generate upgrade preview
        id: generate
        if: steps.release.outputs.upgrade_available == 'true'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          set -o pipefail
          npm run codex:upgrade -- "$CODEX_VERSION" 2>&1 \
            | tee "$REPORT_DIRECTORY/generation.log"

      - name: Write diff report
        if: always() && steps.release.outputs.upgrade_available == 'true'
        env:
          CODEX_VERSION: ${{ steps.release.outputs.version }}
          PREVIEW_RESULT: ${{ steps.generate.outcome == 'success' && 'success' || 'failure' }}
          REPORT_DIRECTORY: ${{ runner.temp }}/codex-upgrade-preview
        run: |
          node scripts/write-upgrade-report.mjs \
            "$CODEX_VERSION" "$REPORT_DIRECTORY" stable "$PREVIEW_RESULT"

      - name: Upload diff files
        if: always() && steps.release.outputs.upgrade_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-upgrade-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/codex-upgrade-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Fail when preview generation failed
        if: always() && steps.generate.outcome == 'failure'
        run: exit 1
