name: PR description policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  description:
    # Branch Protection 当前按此名称绑定；改名必须先迁移仓库设置。
    name: Project benefits and tradeoffs
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check pull request description
        run: node scripts/check-pr-description.mjs
