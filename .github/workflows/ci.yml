name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebUI dependencies
        run: npm ci --ignore-scripts --prefix webui

      - name: Install locked Codex CLI
        run: npm install --global @openai/codex@0.164.0

      - name: Add npm global bin to PATH
        shell: bash
        run: echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"

      - name: Check protocol consistency
        run: npm run protocol:check

      - name: Run static checks and builds
        run: npm run verify:ci

  windows-runtime:
    name: Windows runtime / Node 22
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebUI dependencies
        run: npm ci --ignore-scripts --prefix webui

      - name: Type-check and validate boundaries
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check documentation
        run: npm run docs:check

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @((Get-Item -LiteralPath 'install.ps1')) + @(Get-ChildItem -LiteralPath 'scripts' -Filter '*.ps1' -File)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell 语法错误：$($file.FullName)"
            }
          }
