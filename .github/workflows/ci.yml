name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install WebUI dependencies
        run: npm ci --ignore-scripts --prefix webui

      - name: Install locked Codex CLI
        run: npm install --global @openai/codex@0.150.1

      - name: Add npm global bin to PATH
        shell: bash
        run: echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"

      - name: Run commit verification
        run: npm run verify:commit

  windows-runtime:
    name: Windows runtime / Node 22
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Use user-owned Windows temp directory
        shell: pwsh
        run: |
          $userTemp = Join-Path $env:USERPROFILE 'AppData\Local\Temp'
          "TEMP=$userTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$userTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WebUI dependencies
        run: npm ci --ignore-scripts --prefix webui

      - name: Build and type-check
        run: |
          npm run build
          npm run check

      - name: Check documentation
        run: npm run docs:check

      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -LiteralPath 'scripts' -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell 语法错误：$($file.FullName)"
            }
          }

      - name: CLI help smoke check
        run: |
          node bin/codexc.mjs --help
          node bin/codexc.mjs service --help

      - name: Diagnose Windows private ACL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          whoami
          Get-Item Env:TEMP, Env:TMP, Env:USERPROFILE | Select-Object Name, Value
          $probe = Join-Path $env:USERPROFILE 'AppData\Local\Temp\codexc-acl-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          $acl = Get-Acl -LiteralPath $probe
          $owner = $acl.GetOwner([System.Security.Principal.SecurityIdentifier])
          "PROBE=$probe"
          "OWNER_SID=$($owner.Value)"
          "CURRENT_SID=$([System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)"
          $acl.Access | Select-Object IdentityReference, FileSystemRights, AccessControlType, IsInherited, InheritanceFlags, PropagationFlags | Format-Table -AutoSize
          $request = @{ operation = 'secure'; kind = 'directory'; path = $probe } | ConvertTo-Json -Compress
          $request | & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'runtime/windows-private-acl.ps1'
          "ACL_EXIT=$LASTEXITCODE"

      - name: Windows compatibility tests
        run: >-
          npx vitest run
          tests/service-install-management.test.ts
          tests/private-file.test.ts
          tests/stdio-transport.test.ts
          tests/unix-websocket-transport.test.ts
          tests/systemd-install.test.ts
          tests/executable.test.ts

  app-server-contract:
    name: Codex 0.150.1 App Server contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install locked Codex CLI
        run: npm install --global @openai/codex@0.150.1

      - name: Check protocol version
        run: npm run protocol:check

      - name: Run isolated App Server contract
        run: RUN_CODEX_CONTRACT=1 npm test -- --run tests/real-app-server.test.ts
